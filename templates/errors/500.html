{% extends 'base.html' %}
{% block title %}500 — LegitEdu{% endblock %}
{% block content %}
<section class="error-page-section">
    <div class="container">
        <div class="error-card text-center mx-auto">
            <div class="error-logo mb-3">
                {% load static %}<img src="{% static 'img/logo-icon.svg' %}" alt="LegitEdu">
            </div>
            <h1>500</h1>
            <h3>Something Went Wrong</h3>
            <p>A temporary server error occurred. Please try again shortly.</p>
            <form class="error-search search-form mx-auto" action="{% url 'post_list' %}" method="get">
                <input class="form-control" type="search" name="q" placeholder="Search news, JAMB, scholarships...">
                <button class="btn btn-search" type="submit"><i class="fa fa-search"></i></button>
            </form>
            <div class="error-actions mt-4">
                <a href="{% url 'home' %}" class="btn btn-primary">Home</a>
                <a href="{% url 'post_list' %}" class="btn btn-outline-primary">Latest News</a>
                <a href="{% url 'scholarship_list' %}" class="btn btn-outline-primary">Scholarships</a>
                <a href="{% url 'contact' %}" class="btn btn-outline-primary">Contact Us</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
